name: Deploy pilger.milsh.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Grund für den manuellen Deploy"
        required: false
        default: "manueller Deploy"

concurrency:
  group: deploy-pilger
  cancel-in-progress: false

env:
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PORT: ${{ secrets.SSH_PORT }}
  SSHPASS: ${{ secrets.SSH_PASSWORD }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
  DB_DRIVER: ${{ secrets.DB_DRIVER }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASS: ${{ secrets.DB_PASS }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
  DB_ADMIN_PASS: ${{ secrets.DB_ADMIN_PASS }}
  WRITE_PASSWORD: ${{ secrets.WRITE_PASSWORD }}
  SITE_URL: ${{ secrets.SITE_URL }}

jobs:
  deploy:
    name: Auf den Server spielen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: PHP prüfen (Syntax aller Dateien)
        run: |
          php -v
          find src db public config -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Smoke-Test gegen SQLite (App muss ohne DB-Server starten)
        run: |
          php -S 127.0.0.1:8123 -t public &
          sleep 3
          code=$(curl -s -o /tmp/out.html -w '%{http_code}' http://127.0.0.1:8123/)
          echo "HTTP $code"
          test "$code" = "200"
          grep -q 'id="costTotal"' /tmp/out.html
          grep -q 'map-data' /tmp/out.html
          echo "Startseite rendert."

      - name: Secrets prüfen
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ]    && missing="$missing SSH_HOST"
          [ -z "$SSH_USER" ]    && missing="$missing SSH_USER"
          [ -z "$DEPLOY_PATH" ] && missing="$missing DEPLOY_PATH"
          if [ -z "$SSH_KEY" ] && [ -z "$SSHPASS" ]; then
            missing="$missing SSH_KEY-oder-SSH_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Repository-Secrets:$missing — siehe docs/DEPLOYMENT.md"
            exit 1
          fi

          # Schutz vor einem versehentlich zu weit gefassten DEPLOY_PATH:
          # rsync läuft mit --delete, ein falscher Pfad wäre teuer.
          case "$DEPLOY_PATH" in
            /|/var|/var/www|/home|/usr|/etc|/srv|/root|*/)
              echo "::error::DEPLOY_PATH '$DEPLOY_PATH' ist zu weit gefasst oder endet auf '/'. Bitte ein eigenes Verzeichnis angeben, z. B. /var/www/pilger.milsh.com"
              exit 1;;
          esac
          depth=$(echo "$DEPLOY_PATH" | awk -F/ '{print NF-1}')
          if [ "${DEPLOY_PATH#/}" = "$DEPLOY_PATH" ] || [ "$depth" -lt 2 ]; then
            echo "::error::DEPLOY_PATH muss ein absoluter Pfad mit mindestens zwei Ebenen sein (aktuell: '$DEPLOY_PATH')."
            exit 1
          fi

          if [ -n "$SSH_KEY" ]; then echo "Zugang: SSH-Schlüssel"; else echo "Zugang: Passwort"; fi
          echo "Alle Pflicht-Secrets vorhanden, DEPLOY_PATH sieht plausibel aus."

      - name: Server erreichbar? SSH-Port prüfen
        run: |
          port="${SSH_PORT:-22}"
          echo "Prüfe $SSH_HOST:$port …"
          if timeout 8 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/$port" 2>/dev/null; then
            echo "Port $port ist offen."
            exit 0
          fi

          echo "Port $port antwortet nicht. Suche nach einem alternativen SSH-Port …"
          found=""
          for p in 22 2222 2022 2200 22222 62222 8022; do
            if timeout 4 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/$p" 2>/dev/null; then
              found="$found $p"
            fi
          done

          if [ -n "$found" ]; then
            echo "::error::SSH-Port $port ist zu. Offen sind dagegen:$found — bitte das Secret SSH_PORT auf den passenden Wert setzen."
          else
            echo "::error::Auf $SSH_HOST ist kein SSH-Port erreichbar (geprüft: 22 2222 2022 2200 22222 62222 8022). Entweder läuft SSH auf einem anderen Port, oder die Firewall lässt nur bestimmte Adressen zu — GitHub-Runner haben wechselnde IPs und brauchen daher offenen Zugang. Siehe docs/DEPLOYMENT.md."
          fi
          exit 1

      - name: SSH-Zugang einrichten
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          port="${SSH_PORT:-22}"
          mkdir -p ~/.ssh ~/bin
          if ssh-keyscan -T 10 -p "$port" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Hostkey übernommen."
          else
            echo "Hinweis: ssh-keyscan lieferte keinen Hostkey — es wird StrictHostKeyChecking=accept-new verwendet."
          fi
          chmod 644 ~/.ssh/known_hosts

          # dssh kapselt den Unterschied zwischen Schlüssel und Passwort,
          # alle folgenden Schritte rufen nur noch dssh auf.
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            printf '#!/bin/sh\nexec ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i "$HOME/.ssh/id_deploy" -p %s "$@"\n' "$port" > ~/bin/dssh
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            printf '#!/bin/sh\nexec sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p %s "$@"\n' "$port" > ~/bin/dssh
          fi
          chmod +x ~/bin/dssh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verbindung testen
        run: |
          if ! dssh "$SSH_USER@$SSH_HOST" 'echo "verbunden als $(whoami) auf $(hostname)"; php -v | head -1 || echo "ACHTUNG: kein php auf dem Server gefunden"; command -v rsync >/dev/null || echo "ACHTUNG: kein rsync auf dem Server gefunden"'; then
            echo "::error::Anmeldung an $SSH_HOST fehlgeschlagen. Prüfe SSH_USER und SSH_PASSWORD bzw. SSH_KEY — oder ob der Server Passwort-Anmeldung überhaupt erlaubt (PasswordAuthentication in der sshd-Konfiguration)."
            exit 1
          fi

      - name: Datenbankdaten festlegen
        run: |
          # Es müssen keine DB-Secrets hinterlegt sein. Fehlen Name oder Benutzer,
          # heißen beide 'pilger'; fehlt das Passwort, wird eines erzeugt. Da der
          # Deploy im selben Lauf sowohl den MySQL-Benutzer setzt als auch
          # config.php schreibt, passen beide Seiten immer zusammen.
          driver="${DB_DRIVER:-mysql}"
          name="${DB_NAME:-pilger}"
          user="${DB_USER:-pilger}"
          pass="$DB_PASS"

          if [ "$driver" = "sqlite" ]; then
            echo "Datenbank: SQLite (per DB_DRIVER erzwungen)"
          else
            if [ -z "$pass" ]; then
              pass="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | cut -c1-28)"
              echo "::add-mask::$pass"
              echo "Kein DB_PASS hinterlegt — ein Passwort wurde erzeugt und in config.php eingetragen."
            fi
            echo "Datenbank: MariaDB ($name), Benutzer $user"
          fi

          {
            echo "RES_DB_DRIVER=$driver"
            echo "RES_DB_NAME=$name"
            echo "RES_DB_USER=$user"
            echo "RES_DB_PASS=$pass"
          } >> "$GITHUB_ENV"

      - name: Konfiguration bauen
        run: |
          php -r '
            $driver = getenv("RES_DB_DRIVER") === "sqlite" ? "sqlite" : "mysql";
            $cfg = [
              "driver" => $driver,
              "mysql"  => [
                "host"    => getenv("DB_HOST") ?: "localhost",
                "port"    => (int)(getenv("DB_PORT") ?: 3306),
                "name"    => getenv("RES_DB_NAME"),
                "user"    => getenv("RES_DB_USER"),
                "pass"    => getenv("RES_DB_PASS"),
                "charset" => "utf8mb4",
              ],
              "sqlite" => ["path" => "var/pilger.sqlite"],
              "write_password" => getenv("WRITE_PASSWORD") ?: null,
              "auto_migrate"   => true,
              "debug"          => false,
            ];
            file_put_contents("config/config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
          '
          php -l config/config.php

      - name: Datenbank und Benutzer anlegen
        run: |
          if [ "$RES_DB_DRIVER" = "sqlite" ]; then
            echo "SQLite-Betrieb — keine Datenbank anzulegen. Übersprungen."
            exit 0
          fi
          DB_NAME="$RES_DB_NAME"; DB_USER="$RES_DB_USER"; DB_PASS="$RES_DB_PASS"

          # Zwei Wege zum MySQL-Admin: hinterlegte Zugangsdaten, sonst sudo mysql
          # (auf Debian/Ubuntu-Installationen üblicherweise ohne Passwort möglich).
          if [ -n "$DB_ADMIN_USER" ]; then
            client="MYSQL_PWD='$DB_ADMIN_PASS' mysql -u '$DB_ADMIN_USER'"
            echo "MySQL-Admin: $DB_ADMIN_USER"
          else
            client="sudo mysql"
            echo "Kein DB_ADMIN_USER hinterlegt — versuche es über 'sudo mysql'."
          fi

          sql="CREATE DATABASE IF NOT EXISTS \\\`$DB_NAME\\\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
               CREATE USER IF NOT EXISTS '$DB_USER'@'localhost' IDENTIFIED BY '$DB_PASS';
               ALTER USER '$DB_USER'@'localhost' IDENTIFIED BY '$DB_PASS';
               GRANT ALL PRIVILEGES ON \\\`$DB_NAME\\\`.* TO '$DB_USER'@'localhost';
               FLUSH PRIVILEGES;"

          if dssh "$SSH_USER@$SSH_HOST" "$client -e \"$sql\""; then
            echo "Datenbank '$DB_NAME' und Benutzer '$DB_USER' sind eingerichtet."
          else
            echo "::error::Datenbank konnte nicht angelegt werden. Moeglichkeiten: DB_ADMIN_USER/DB_ADMIN_PASS als Secret hinterlegen, die Datenbank einmal im Hosting-Panel anlegen (dann DB_NAME/DB_USER/DB_PASS als Secrets setzen), oder mit dem Secret DB_DRIVER=sqlite ganz ohne Datenbankserver starten — siehe docs/DEPLOYMENT.md."
            exit 1
          fi

      - name: Dateien übertragen
        run: |
          dssh "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            -e dssh \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'var/' \
            --exclude 'camino-masterplan-2026.html' \
            --exclude '*.md' \
            --exclude 'docs/' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          echo "Dateien liegen unter $DEPLOY_PATH."

      - name: Schreibrechte für den SQLite-Fallback setzen
        run: |
          dssh "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/var' && chmod 775 '$DEPLOY_PATH/var'"

      - name: Live prüfen (löst zugleich die Schema-Installation aus)
        run: |
          url="${SITE_URL:-https://pilger.milsh.com/}"
          echo "Rufe $url auf …"
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -sS -L -o /tmp/live.html -w '%{http_code}' "$url" || echo 000)
            [ "$code" = "200" ] && break
            echo "Versuch $i: HTTP $code — warte 5 s"
            sleep 5
          done
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::$url antwortet mit HTTP $code. Häufigste Ursachen: DEPLOY_PATH zeigt nicht auf das Document-Root der Domain, oder PHP läuft dort nicht."
            head -40 /tmp/live.html || true
            exit 1
          fi
          grep -q 'id="costTotal"' /tmp/live.html
          echo "pilger.milsh.com ist live und die Datenbank ist installiert."

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Deploy pilger.milsh.com"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Ziel: ${SITE_URL:-https://pilger.milsh.com/}"
            echo "- Datenbank: ${DB_NAME:-SQLite-Fallback}"
            echo "- Ergebnis: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
